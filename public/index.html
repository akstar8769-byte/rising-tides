<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#2b1e15" />
    <title>Rising Tides</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&display=swap" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <!--
      Player patterns: every player has a colour AND a pattern AND a label (P1, P2…),
      so players can be told apart without relying on colour alone.
    -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <defs>
        <pattern id="pat-0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
          <rect width="3" height="8" fill="rgba(255,255,255,.55)" />
        </pattern>
        <pattern id="pat-1" width="8" height="8" patternUnits="userSpaceOnUse">
          <circle cx="4" cy="4" r="1.8" fill="rgba(0,0,0,.45)" />
        </pattern>
        <pattern id="pat-2" width="8" height="8" patternUnits="userSpaceOnUse">
          <path d="M0 0L8 8M8 0L0 8" stroke="rgba(255,255,255,.6)" stroke-width="1.4" />
        </pattern>
        <pattern id="pat-3" width="8" height="8" patternUnits="userSpaceOnUse">
          <rect width="8" height="2.5" fill="rgba(0,0,0,.35)" />
        </pattern>
        <pattern id="pat-4" width="8" height="8" patternUnits="userSpaceOnUse">
          <rect width="4" height="4" fill="rgba(0,0,0,.3)" />
          <rect x="4" y="4" width="4" height="4" fill="rgba(0,0,0,.3)" />
        </pattern>
      </defs>
    </svg>

    <div id="app"><p class="boot">Loading Rising Tides…</p></div>
    <div id="dice-overlay" hidden></div>
    <div id="toasts" aria-live="polite"></div>
    <div id="round-banner" hidden aria-live="polite"></div>
    <div id="tutorial" hidden></div>
    <div id="connection" hidden>Reconnecting…</div>

    <script src="/socket.io/socket.io.js"></script>
    <script type="module" src="/js/app.js"></script>
  </body>
</html>
